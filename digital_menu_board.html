        const mainTitleEl = document.getElementById('main-title');

        function initApp() {
            renderSidebar();
            updateDisplay();
            setupTouchEvents();
            autoDetectLocalAssets();
            setupInactivityListeners();

            // Handle broken image fallbacks gracefully
            mainImageEl.onerror = function () {
                this.src = 'https://placehold.co/1080x1440/1a1a1a/c9a96e?text=AURA+Luxury+Outfit';
            };
        }

        // --- RENDER FUNCTIONS ---

        function renderSidebar() {
            categoryListEl.innerHTML = '';
            fashionData.forEach((cat, index) => {
                const isActive = index === currentState.categoryIndex;

                const btnHTML = `
                    <div class="flex flex-col items-center group cursor-pointer w-full transition-transform duration-300 hover:scale-105" onclick="selectCategory(${index})">
                        <div class="w-14 h-14 md:w-16 md:h-16 rounded-full p-1 transition-all duration-300 ${isActive ? 'bg-aura-gold scale-110 shadow-[0_0_20px_rgba(201,169,110,0.6)]' : 'bg-transparent hover:bg-white/20'}">
                            <img src="${cat.catThumb}" alt="${cat.name}" class="w-full h-full rounded-full object-cover border-2 border-transparent" onerror="this.src='https://placehold.co/200x200/c9a96e/fff?text=${encodeURIComponent(cat.name)}'">
                        </div>
                        <span class="text-[10px] md:text-xs mt-2 font-sans tracking-widest font-bold text-center leading-tight transition-colors duration-300 ${isActive ? 'text-aura-gold font-bold' : 'text-gray-400 group-hover:text-gray-200'}">${cat.name}</span>
                    </div>
                `;
                categoryListEl.insertAdjacentHTML('beforeend', btnHTML);
            });
        }

        function renderThumbnails() {

            const currentItems = currentCat.subcategories && currentState.subcategoryIndex !== null

                : currentCat.items;

            if (!currentItems) return;

            currentItems.forEach((item, index) => {
                const isActive = index === currentState.itemIndex;

                const thumbHTML = `
                    <div class="w-20 h-28 md:w-24 md:h-32 flex-shrink-0 cursor-pointer relative group rounded-xl overflow-hidden transition-all duration-300 ${isActive ? 'ring-2 ring-aura-gold shadow-[0_0_15px_rgba(201,169,110,0.5)] transform -translate-y-2 scale-105' : 'opacity-60 hover:opacity-100'}" onclick="selectItem(${index})">
                        <img src="${item.img}" alt="Thumbnail" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x200/1a1a1a/c9a96e?text=Outfit'">
                        ${isActive ? '<div class="absolute inset-0 border-2 border-aura-gold rounded-xl pointer-events-none"></div>' : '<div class="absolute inset-0 bg-black/30 group-hover:bg-transparent transition-colors"></div>'}
                    </div>
                `;
                thumbnailContainerEl.insertAdjacentHTML('beforeend', thumbHTML);
            });
        }

        function updateDisplay() {
            const currentCat = fashionData[currentState.categoryIndex];

            if (currentCat.subcategories && currentState.subcategoryIndex === null) {
                document.getElementById('image-display-container').classList.add('hidden');
                document.getElementById('thumbnail-gallery-container').classList.add('hidden');

                let subView = document.getElementById('subcategory-view');
                if (!subView) {
                    subView = document.createElement('div');
                    subView.id = 'subcategory-view';
                    subView.className = 'flex-1 w-full h-full bg-black p-8 flex flex-col justify-center items-center z-30 absolute inset-0';
                    document.getElementById('main-area').appendChild(subView);
                }
                subView.classList.remove('hidden');

                subView.innerHTML = `
                    <h2 class="font-serif text-3xl md:text-5xl text-aura-gold font-bold mb-12 tracking-widest uppercase">Select Collection</h2>
                    <div class="flex flex-row space-x-8 justify-center w-full max-w-4xl">
                        ${currentCat.subcategories.map((sub, idx) => `
                            <div onclick="selectSubcategory(${idx})" class="w-64 h-96 cursor-pointer relative group rounded-2xl overflow-hidden shadow-2xl transition-all duration-500 hover:scale-105 border border-white/10 hover:border-aura-gold/50">
                                <img src="${sub.catThumb}" alt="${sub.name}" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent flex items-end p-6">
                                    <h3 class="font-serif text-2xl text-white font-bold group-hover:text-aura-gold transition-colors">${sub.name}</h3>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                sidebarEl.style.background = `linear-gradient(to bottom, ${currentCat.themeColor}, #0a0a0a)`;
                renderSidebar();
                stopSlideshow();
                return;
            }

            let subView = document.getElementById('subcategory-view');
            if (subView) subView.classList.add('hidden');

            document.getElementById('image-display-container').classList.remove('hidden');
            document.getElementById('thumbnail-gallery-container').classList.remove('hidden');

            const activeItems = currentCat.subcategories ? currentCat.subcategories[currentState.subcategoryIndex].items : currentCat.items;
            const currentItem = activeItems[currentState.itemIndex];
            const displayName = currentCat.subcategories ? currentCat.subcategories[currentState.subcategoryIndex].name : currentCat.name;

            sidebarEl.style.background = `linear-gradient(to bottom, ${currentCat.themeColor}, #0a0a0a)`;

            let backBtn = document.getElementById('back-to-subcategories-btn');
            if (currentCat.subcategories) {
                if (!backBtn) {
                    backBtn = document.createElement('button');
                    backBtn.id = 'back-to-subcategories-btn';
                    backBtn.onclick = backToSubcategories;
                    backBtn.className = 'absolute top-6 left-6 z-50 glass-panel hover:bg-aura-gold text-white hover:text-black px-4 py-2 rounded-full flex items-center justify-center transition-all shadow-lg hover:scale-105 active:scale-95 text-sm font-sans font-bold tracking-widest uppercase';
                    backBtn.innerHTML = '<i class="fa-solid fa-arrow-left mr-2"></i> Back';
                    document.getElementById('image-display-container').appendChild(backBtn);
                }
                backBtn.classList.remove('hidden');
            } else if (backBtn) {
                backBtn.classList.add('hidden');
            }

            // Animate Out Text and Main Image
            mainTitleEl.classList.remove('translate-y-0', 'opacity-100');
            mainTitleEl.classList.add('translate-y-4', 'opacity-0');
            mainDescEl.classList.remove('translate-y-0', 'opacity-100');
            mainDescEl.classList.add('translate-y-4', 'opacity-0');
            mainImageEl.classList.remove('opacity-100', 'scale-100');
            mainImageEl.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                categoryBadgeEl.textContent = displayName;
                mainImageEl.src = currentItem.img;
                mainTitleEl.textContent = currentItem.title;
                mainDescEl.textContent = currentItem.desc;

                mainImageEl.classList.remove('opacity-0', 'scale-95');
                mainImageEl.classList.add('opacity-100', 'scale-100');

                setTimeout(() => {
                    mainTitleEl.classList.remove('translate-y-4', 'opacity-0');
                    mainTitleEl.classList.add('translate-y-0', 'opacity-100');
                }, 100);

                setTimeout(() => {
                    mainDescEl.classList.remove('translate-y-4', 'opacity-0');
                    mainDescEl.classList.add('translate-y-0', 'opacity-100');
                }, 200);
            }, 250);

            renderSidebar();
            renderThumbnails();
            resetProgressBar();
        }

        // --- NAVIGATION & INTERACTION ---

        function selectCategory(index) {
            if (currentState.categoryIndex === index && currentState.subcategoryIndex === null) return;
            currentState.categoryIndex = index;
            currentState.itemIndex = 0;
            currentState.subcategoryIndex = null;
            updateDisplay();
            resetAutoPlayTimer();
        }

        function selectSubcategory(index) {
            currentState.subcategoryIndex = index;
            currentState.itemIndex = 0;
            updateDisplay();
            resetAutoPlayTimer();
        }

        function backToSubcategories() {
            currentState.subcategoryIndex = null;
            updateDisplay();
        }

        function selectItem(index) {
            if (currentState.itemIndex === index) return;
            currentState.itemIndex = index;
            updateDisplay();
            resetAutoPlayTimer();
        }

        function nextItem() {
            const currentCat = fashionData[currentState.categoryIndex];
            const activeItems = currentCat.subcategories && currentState.subcategoryIndex !== null
                ? currentCat.subcategories[currentState.subcategoryIndex].items
                : currentCat.items;

            if (currentState.itemIndex + 1 < activeItems.length) {
                currentState.itemIndex++;
            } else {
                if (currentCat.subcategories && currentState.subcategoryIndex + 1 < currentCat.subcategories.length) {
                    currentState.subcategoryIndex++;
                    currentState.itemIndex = 0;
                } else {
                    currentState.categoryIndex = (currentState.categoryIndex + 1) % fashionData.length;
                    const nextCat = fashionData[currentState.categoryIndex];
                    if (nextCat.subcategories) {
                        currentState.subcategoryIndex = 0;
                    } else {
                        currentState.subcategoryIndex = null;
                    }
                    currentState.itemIndex = 0;
                }
            }
            updateDisplay();
        }

        function prevItem() {
            const currentCat = fashionData[currentState.categoryIndex];
            const activeItems = currentCat.subcategories && currentState.subcategoryIndex !== null
                ? currentCat.subcategories[currentState.subcategoryIndex].items
                : currentCat.items;

            if (currentState.itemIndex > 0) {
                currentState.itemIndex--;
            } else {
                if (currentCat.subcategories && currentState.subcategoryIndex > 0) {
                    currentState.subcategoryIndex--;
                    currentState.itemIndex = currentCat.subcategories[currentState.subcategoryIndex].items.length - 1;
                } else {
                    currentState.categoryIndex = (currentState.categoryIndex - 1 + fashionData.length) % fashionData.length;
                    const prevCat = fashionData[currentState.categoryIndex];
                    if (prevCat.subcategories) {
                        currentState.subcategoryIndex = prevCat.subcategories.length - 1;
                        currentState.itemIndex = prevCat.subcategories[currentState.subcategoryIndex].items.length - 1;
                    } else {
                        currentState.subcategoryIndex = null;
                        currentState.itemIndex = prevCat.items.length - 1;
                    }
                }
            }
            updateDisplay();
            resetAutoPlayTimer();
        }

        function scrollThumbnails(direction) {
            thumbnailContainerEl.scrollBy({ left: direction * 150, behavior: 'smooth' });
        }

        // --- DYNAMIC FOLDER SYNC ENGINE (`webkitdirectory`) ---

        // --- AUTOMATIC LOCAL ASSET DETECTION ENGINE ---

        function autoDetectLocalAssets() {
            const folderMap = {
                'toppicks': 'Top Picks',
                'blazers': 'Blazers',
                '2pcsuits': '2Pc Suits',
                '3pcsuits': '3Pc Suits',
                'jodhapuri': 'Jodhapuri',
                'sherwani': 'Sherwani',
                'kurta': 'Kurta',
                'dhotis': 'Dhotis',
                'shirts': 'Shirts',
                'trousers': 'Trousers',
                'formalbundi': 'Bundi/Formal Bundi',
                'ethnicbundi': 'Bundi/Ethnic Bundi',
                'blazers_casuals': 'Blazers/Casuals',
                'blazers_formals': 'Blazers/Formals',
                '2pcsuits_formals': '2Pc Suits/Formals',
                '2pcsuits_wedding': '2Pc Suits/Wedding',
                '3pcsuits_waistcoats': '3Pc Suits/Waistcoats',
                '3pcsuits_wedding': '3Pc Suits/Wedding',
                'jodhpuri_formal': 'Jodhapuri/Formal',
                'jodhpuri_wedding': 'Jodhapuri/Wedding'
            };

            const candidates = [
                'sample image.jpg', 'sample image.png', 'sample image.jpeg',
                'sample.jpg', 'sample.png',
                '1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg',
                '1.png', '2.png', '3.png',
                'outfit1.jpg', 'outfit2.jpg', 'outfit3.jpg',
                'image1.jpg', 'image2.jpg', 'image3.jpg'
            ];

            fashionData.forEach(cat => {
                if (cat.subcategories) {
                    cat.subcategories.forEach(sub => {
                        const folderName = folderMap[sub.id] || sub.name;
                        const foundItems = [];

                        candidates.forEach(filename => {
                            const imgUrl = `assets/${folderName}/${filename}`;
                            const img = new Image();
                            img.onload = function () {
                                if (!foundItems.some(i => i.img === imgUrl)) {
                                    const rawTitle = filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").toUpperCase();
                                    const cleanTitle = (rawTitle === 'SAMPLE IMAGE' || rawTitle === 'SAMPLE') ? `${sub.name} OUTFIT` : rawTitle;
                                    foundItems.push({
                                        title: cleanTitle,
                                        desc: `Tailored outfit from ${sub.name} collection`,
                                        img: imgUrl
                                    });
                                    sub.items = foundItems;
                                    sub.catThumb = foundItems[0].img;
                                    updateDisplay();
                                }
                            };
                            img.src = imgUrl;
                        });
                    });
                } else {
                    const folderName = folderMap[cat.id] || cat.name;
                    const foundItems = [];

                    candidates.forEach(filename => {
                        const imgUrl = `assets/${folderName}/${filename}`;
                        const img = new Image();
                        img.onload = function () {
                            if (!foundItems.some(i => i.img === imgUrl)) {
                                const rawTitle = filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").toUpperCase();
                                const cleanTitle = (rawTitle === 'SAMPLE IMAGE' || rawTitle === 'SAMPLE') ? `${cat.name} OUTFIT` : rawTitle;
                                foundItems.push({
                                    title: cleanTitle,
                                    desc: `Tailored outfit from ${cat.name} collection`,
                                    img: imgUrl
                                });
                                cat.items = foundItems;
                                cat.catThumb = foundItems[0].img;
                                updateDisplay();
                            }
                        };
                        img.src = imgUrl;
                    });
                }
            });
        }

        // --- KIOSK AUTO-PLAY & PROGRESS BAR ---

        function startSlideshow() {
            stopSlideshow();
            isAutoPlay = true;
            document.getElementById('autoplay-icon').className = 'fa-solid fa-pause text-sm text-aura-gold';
            autoPlayTimer = setInterval(nextItem, SLIDESHOW_INTERVAL);
            resetProgressBar();
        }

        function stopSlideshow() {
            isAutoPlay = false;
            document.getElementById('autoplay-icon').className = 'fa-solid fa-play text-sm text-white';
            if (autoPlayTimer) clearInterval(autoPlayTimer);
            if (progressTimer) clearInterval(progressTimer);
            progressBarEl.style.width = '0%';
        }

        function toggleSlideshow(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            if (isAutoPlay) {
                stopSlideshow();
                showToast('Slideshow Paused');
            } else {
                startSlideshow();
                showToast('Slideshow Started');
            }
        }

        function resetAutoPlayTimer() {
            if (isAutoPlay) {
                startSlideshow();
            }
        }

        function resetProgressBar() {
            if (!isAutoPlay) return;
            if (progressTimer) clearInterval(progressTimer);
            progressBarEl.style.transition = 'none';
            progressBarEl.style.width = '0%';

            setTimeout(() => {
                progressBarEl.style.transition = `width ${SLIDESHOW_INTERVAL}ms linear`;
                progressBarEl.style.width = '100%';
            }, 50);
        }

        // --- 2-MINUTE INACTIVITY AUTO-START ENGINE ---

        function setupInactivityListeners() {
            const events = ['mousemove', 'mousedown', 'touchstart', 'scroll', 'keydown'];
            events.forEach(evt => {
                window.addEventListener(evt, handleUserActivity, { passive: true });
            });
            resetInactivityTimer();
        }

        function handleUserActivity(e) {
            if (e && e.target && e.target.closest && e.target.closest('#autoplay-btn')) {
                return;
            }
            resetInactivityTimer();
        }

        function resetInactivityTimer() {
            if (inactivityTimer) clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                startSlideshow();
                showToast('Slideshow Auto-Started (2 min inactivity)');
            }, INACTIVITY_TIMEOUT);
        }



        // --- FULLSCREEN KIOSK ---

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                boardContainerEl.requestFullscreen().catch(err => {
                    showToast('Fullscreen not supported by browser');
                });
            } else {
                document.exitFullscreen();
            }
        }

        // --- TOUCH SWIPE GESTURES ---

        function setupTouchEvents() {
            let touchStartX = 0;
            let touchEndX = 0;
            const displayArea = document.getElementById('image-display-container');

            displayArea.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            displayArea.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 50) {
                    if (diff < 0) {
                        nextItem();
                    } else {
                        prevItem();
                    }
                }
            }
        }



        // --- SEARCH OVERLAY MODAL ---

        function openSearchModal() {
            stopSlideshow();
            document.getElementById('search-modal').classList.remove('hidden');
            document.getElementById('search-input').value = '';
            handleSearch();
            document.getElementById('search-input').focus();
        }

        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('hidden');
            resetAutoPlayTimer();
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('search-results');
            container.innerHTML = '';

            fashionData.forEach((cat, catIdx) => {
                cat.items.forEach((item, itemIdx) => {
                    if (item.title.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query) || cat.name.toLowerCase().includes(query)) {
                        const cardHTML = `
                            <div onclick="selectSearchResult(${catIdx}, ${itemIdx})" class="glass-panel p-3 rounded-2xl cursor-pointer hover:border-aura-gold transition-all hover:scale-105 group">
                                <div class="w-full h-40 rounded-xl overflow-hidden mb-2">
                                    <img src="${item.img}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onerror="this.src='https://placehold.co/200x200/1a1a1a/c9a96e?text=Outfit'">
                                </div>
                                <span class="text-[10px] text-aura-gold font-bold uppercase tracking-widest block">${cat.name}</span>
                                <h4 class="text-sm font-serif font-bold text-white group-hover:text-aura-gold transition-colors line-clamp-1">${item.title}</h4>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', cardHTML);
                    }
                });
            });
        }

        function selectSearchResult(catIdx, itemIdx) {
            currentState.categoryIndex = catIdx;
            currentState.itemIndex = itemIdx;
            closeSearchModal();
            updateDisplay();
        }

        // --- TOAST NOTIFICATIONS ---

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Initialize application on load
        window.onload = initApp;
    </script>
</body>
